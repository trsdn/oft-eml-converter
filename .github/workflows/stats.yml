name: Repository stats

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/stats.yml

permissions:
  contents: write

jobs:
  stats:
    uses: trsdn/.github/.github/workflows/repo-stats.yml@main
    with:
      output-dir: .github/stats
      theme: both
      cards: repo-card
      # main is protected, so GITHUB_TOKEN cannot push to it. The card is
      # generated onto its own branch and referenced from there.
      branch: stats
    secrets:
      STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
